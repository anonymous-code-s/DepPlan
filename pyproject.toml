[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "depplan-artifacts"
version = "0.1.0"
description = "Semantic-guided dependency planning for multi-hop question answering"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "safetensors>=0.6", "sentence-transformers>=5.1", "transformers>=4.45", "numpy>=1.24", "scipy>=1.10", "openai>=1.40", "autogen-agentchat==0.7.4", "autogen-core==0.7.4"]

[project.optional-dependencies]
parsing = ["amrlib==0.8.0", "penman==1.3.1", "smatch==1.0.4"]

[project.scripts]
depplan = "depplan.cli:main"
depplan-baselines = "baselines.run:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["depplan*", "baselines", "baselines.methods*", "baselines.prompts*"]
namespaces = false

[tool.setuptools.package-data]
"depplan.semantic_units" = ["*.json"]
"baselines" = ["configs/*.json", "configs/methods/*.json"]
